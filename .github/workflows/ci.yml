name: Foundation CI
on:
  push:
    branches: [main, foundation, frontend, ha-bindings, integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts
      - name: Validate boundary and contracts
        run: npm run check
      - name: Build HomeManager bundle
        run: npm run build
      - name: Install Chromium for synthetic browser checks
        run: npx playwright install --with-deps chromium
      - name: Validate frontend in desktop and mobile browsers
        run: npm run test:browser
      - name: Audit all dependencies
        if: always() && steps.install.outcome == 'success'
        run: npm audit --audit-level=high
      - name: Build and inspect the allowlisted package
        run: npm run package
      - name: Retain the verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homemanager-package-${{ github.run_id }}
          path: |
            .work/release/homemanager.zip
            .work/release/homemanager.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  integration:
    name: integration (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum declared in hacs.json, and the current release.
          - { ha: '2026.2.3', python: '3.13', requirements: requirements_test.txt }
          - { ha: '2026.10.4', python: '3.14', requirements: requirements_test_latest.txt }
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test harness
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Test the companion integration against Home Assistant
        run: python -m pytest -q
