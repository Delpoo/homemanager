name: Foundation CI
on:
  push:
    branches: [main, foundation, frontend, ha-bindings, integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate boundary and contracts
        run: npm run check
      - name: Build HomeManager bundle
        run: npm run build
      - name: Install Chromium for synthetic browser checks
        run: npx playwright install --with-deps chromium
      - name: Validate frontend in desktop and mobile browsers
        run: npm run test:browser
      - name: Audit all dependencies
        run: npm audit --audit-level=high
  integration:
    name: integration (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum declared in hacs.json, and the current release.
          - { ha: '2026.2.3', python: '3.13', requirements: requirements_test.txt }
          - { ha: '2026.10.4', python: '3.14', requirements: requirements_test_latest.txt }
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test harness
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Test the companion integration against Home Assistant
        run: python -m pytest -q
