name: Prepare verified draft release
# Manual preparation only. Publishing remains a separate owner action.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for example v0.3.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing version tag from main
        id: source
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git show-ref --verify --quiet "refs/tags/$TAG"
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          test "$SHA" = "$(git rev-parse origin/main)"
          test "$SHA" = "$WORKFLOW_SHA"
          VERSION=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$TAG" = "v$VERSION"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
  draft:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout or repository code execution in this write-enabled job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homemanager-package-${{ github.run_id }}
          path: release
      - name: Verify artifact checksum
        run: cd release && sha256sum -c homemanager.zip.sha256
      - name: Attest the verified archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/homemanager.zip
      - name: Prepare a new draft without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for this tag; refusing to replace it."
            exit 1
          fi
          printf 'Source commit: %s\n\nAll browser, dependency, package and HA matrix checks passed in this workflow. Review before manually publishing.\n' "$SOURCE_SHA" > release-notes.txt
          gh release create "$TAG" --draft --verify-tag --title "HomeManager $TAG" --notes-file release-notes.txt release/homemanager.zip release/homemanager.zip.sha256
