name: Release package
# Runs only when the owner publishes a GitHub release. It never creates tags or
# releases: it verifies the tag matches the version, runs the full test suite
# and attaches homemanager.zip (integration + frontend bundle) for HACS.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Tag must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - name: Verify
        run: |
          npm ci --ignore-scripts
          npm run check
          python -m pip install -r requirements_test.txt
          python -m pytest -q
      - name: Build the integration package
        run: npm run package
      - name: Attach homemanager.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum .work/release/homemanager.zip > .work/release/homemanager.zip.sha256
          gh release upload "$TAG" .work/release/homemanager.zip .work/release/homemanager.zip.sha256 --clobber
