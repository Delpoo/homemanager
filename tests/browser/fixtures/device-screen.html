<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pantallas ficticias · HomeManager</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f5f0;
        height: 100%;
        font: 14px system-ui;
      }
      #mount,
      homemanager-card {
        display: block;
        height: 100%;
      }
      homemanager-card{--hm-viewport-height:calc(100dvh - 58px)}
      @media(max-width:1099px){homemanager-card{--hm-viewport-height:calc(100dvh - 122px)}}
      @media(max-width:650px){homemanager-card{--hm-viewport-height:calc(100dvh - 114px)}}
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module" src="./device-screen-harness.js"></script>
  </body>
</html>
