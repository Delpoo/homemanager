<title>HomeManager 0.13 maqueta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>/* HomeManager 0.13 — maqueta. Concepto: el plano siempre a la vista; todo se edita en un panel
   lateral con vista previa en vivo; acciones con iconos y ayudas al pasar el mouse. */
:root {
  --bg: #f4f5f0; --surface: #ffffff; --ink: #1f2a24; --muted: #5f6e66; --line: #dde2d8;
  --brand: #4f7a5a; --on-brand: #ffffff; --edit: #c77700; --edit-ink: #7a4300;
  --alert: #d0453a; --warn: #d98b1f; --ok: #3f8f5f; --cool: #4f8fbf; --info: #4f8fbf;
  --wall: #3e4b43; --floor: #efe9dc; --floor-wood: #e6d3b5; --floor-tile: #e8ebe6; --floor-deck: #ddd3c0;
  --furn: rgba(62, 75, 67, .16);
  --rv-bg: #1d2420; --rv-ink: #e8ece6; --rv-muted: #9aa59f;
  --font: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --s2: color-mix(in srgb, var(--ink) 6%, transparent);
  --s3: color-mix(in srgb, var(--ink) 10%, transparent);
  --brand-soft: color-mix(in srgb, var(--brand) 14%, var(--surface));
  --edit-soft: color-mix(in srgb, #e8a33d 20%, var(--bg));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1b221e; --ink: #e8ece6; --muted: #9aa59f; --line: #2c3530;
    --brand: #8fb38b; --on-brand: #121714; --edit: #f0b455; --edit-ink: #f7cd86;
    --alert: #e5645a; --warn: #e9a23b; --ok: #5db07f; --cool: #6fa9d6; --info: #6fa9d6;
    --wall: #9fb0a5; --floor: #26302a; --floor-wood: #3a3227; --floor-tile: #252c28; --floor-deck: #322d25;
    --furn: rgba(159, 176, 165, .16); --rv-bg: #0b0f0d;
    --edit-soft: color-mix(in srgb, #f0b455 16%, var(--bg)); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1b221e; --ink: #e8ece6; --muted: #9aa59f; --line: #2c3530;
  --brand: #8fb38b; --on-brand: #121714; --edit: #f0b455; --edit-ink: #f7cd86;
  --alert: #e5645a; --warn: #e9a23b; --ok: #5db07f; --cool: #6fa9d6; --info: #6fa9d6;
  --wall: #9fb0a5; --floor: #26302a; --floor-wood: #3a3227; --floor-tile: #252c28; --floor-deck: #322d25;
  --furn: rgba(159, 176, 165, .16); --rv-bg: #0b0f0d;
  --edit-soft: color-mix(in srgb, #f0b455 16%, var(--bg)); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 12px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; display: block; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 24px; height: 24px; }

/* ——— Barra de revisión (no es parte de la app) ——— */
.review { display: flex; align-items: center; gap: 10px; padding: 10px 0; flex-wrap: wrap; }
.review b { font-size: 13px; letter-spacing: .02em; }
.review .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.screens { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.screens button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; }
.screens button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.screens .grp { font-size: 11px; color: var(--muted); align-self: center; margin-left: 6px; text-transform: uppercase; letter-spacing: .06em; }
.screen-sel { display: none; flex: 1; min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 8px; }
.tile span svg.i, .wlist svg.i { display: inline-block; vertical-align: -3px; }
.notes-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; display: flex; gap: 6px; align-items: center; font-size: 12.5px; }

/* ——— App ——— */
.app { flex: 1; min-height: 520px; display: grid; grid-template-rows: 60px 1fr; border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; background: var(--bg); position: relative; }
.top { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; background: var(--surface);
  border-bottom: 1px solid var(--line); min-width: 0; transition: background .2s; }
.top.edit { background: var(--edit-soft); border-bottom-color: color-mix(in srgb, var(--edit) 45%, var(--line)); }
.home-pick { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 8px; border-radius: 10px; font-weight: 500; font-size: 15px; white-space: nowrap; }
.home-pick:hover { background: var(--s2); }
.home-pick .logo { color: var(--brand); }
.activity { flex: 1; min-width: 0; margin: 0 8px; padding: 8px 14px; border-radius: 999px; background: var(--s2); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding: 0 6px; }
.ib { width: 40px; height: 40px; border-radius: 12px; border: 0; background: none; display: grid; place-items: center; color: var(--ink); position: relative; flex: none; }
.ib:hover { background: var(--s2); }
.ib.on, .ib[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.ib.danger { color: var(--alert); }
.ib.primary { background: var(--brand); color: var(--on-brand); }
.ib[disabled] { opacity: .35; cursor: default; }
.ib .badge { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--edit); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
.tools { display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.tools .ib.on { background: var(--edit); color: #fff; }
.grow { flex: 1; }

.body { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; min-height: 0; }
.rail { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-right: 1px solid var(--line); background: var(--surface); overflow: auto; }
.rail .ib.on { background: var(--brand-soft); color: var(--brand); }
.stage { position: relative; overflow: hidden; min-width: 0; }
.stage.edit::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--edit); pointer-events: none; }
.planwrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
.plan { position: relative; width: min(100%, calc((100vh - 220px) * 1000 / 700)); aspect-ratio: 1000 / 700; transition: transform .35s ease; }
.plan svg.arch { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.space-hit { cursor: pointer; }
.zoombox { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 3px; gap: 2px; z-index: 3; }
.layerbox { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 2px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 3px; z-index: 3; }
.fab { position: absolute; left: 14px; bottom: 70px; width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: var(--shadow); z-index: 3; }
.ptool { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 3; }
.ptool .bar { display: flex; gap: 2px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 4px; }
.ptool .bar .ib.on { background: var(--brand); color: var(--on-brand); }
.ptool .hint { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; white-space: nowrap; }

/* Símbolos */
.sym { position: absolute; transform: translate(-50%, -50%) scale(var(--k, 1)); transform-origin: center; z-index: 2;
  width: calc(var(--px) * 1px); height: calc(var(--px) * 1px); display: grid; place-items: center; border: 0; padding: 0;
  border-radius: 50%; color: var(--c); background: color-mix(in srgb, var(--surface) calc(var(--o) * 1%), transparent);
  box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: box-shadow .15s, transform .35s ease; }
.sym svg.i { width: 55%; height: 55%; }
.sym[data-shape="rounded"] { border-radius: 30%; }
.sym[data-shape="square"] { border-radius: 8%; }
.sym[data-shape="none"] { background: none; box-shadow: none; }
.sym[data-shape="dot"] { width: 14px; height: 14px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--surface) 80%, transparent); }
.sym[data-shape="dot"] svg { display: none; }
.sym.unlinked { outline: 2px dashed var(--edit); outline-offset: 3px; }
.sym.linkmark::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px var(--surface); }
.sym.sel { box-shadow: 0 0 0 3px var(--brand), 0 4px 14px rgba(0,0,0,.22); }
.sym.alerting { box-shadow: 0 0 0 3px var(--warn), 0 1px 3px rgba(0,0,0,.18); }
.sym .val { position: absolute; left: calc(100% + 5px); top: 50%; transform: translateY(-50%); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 3px 9px; font-size: 12.5px; font-weight: 500; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.16); font-variant-numeric: tabular-nums; }
.sym .bdg { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--warn); color: #fff; display: grid; place-items: center; }
.sym .bdg svg { width: 11px; height: 11px; }
.dimmed .sym { opacity: .25; pointer-events: none; }

/* Panel derecho */
.side { width: 400px; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side.now { width: 340px; background: var(--bg); }
.dh { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); min-height: 64px; }
.dh h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dbody { flex: 1; overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.dbody > * { flex-shrink: 0; }
.dfoot { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
.stabs { display: flex; gap: 2px; padding: 8px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.stabs .ib.on { background: var(--brand); color: var(--on-brand); }

.lbl { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.lbl .grow { height: 1px; background: var(--line); }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 76px; align-items: center; gap: 12px; min-height: 40px; color: var(--ink); }
.row > svg { color: var(--muted); }
.row.wide { grid-template-columns: 24px minmax(0, 1fr) auto; }
.row .name { font-size: 14px; }
input[type="range"] { width: 100%; accent-color: var(--brand); height: 28px; margin: 0; }
.num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); height: 36px; padding: 0 8px; }
.num input { width: 100%; border: 0; background: none; text-align: right; font-variant-numeric: tabular-nums; padding: 0 2px; }
.num input:focus { outline: none; } .num:focus-within { border-color: var(--brand); }
.num span { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--s2); }
.seg .ib { width: 36px; height: 34px; border-radius: 9px; }
.seg .ib.on { background: var(--surface); color: var(--brand); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.field { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); height: 40px; padding: 0 12px; width: 100%; color: var(--ink); }
.field:focus { outline: none; border-color: var(--brand); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 10px; background: var(--surface); font-size: 13px; color: var(--ink); white-space: nowrap; }
.chip button { border: 0; background: none; padding: 2px; border-radius: 50%; color: var(--muted); display: grid; }
.chip button:hover { background: var(--s2); color: var(--ink); }
.chip.add { border-style: dashed; color: var(--muted); padding: 4px 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.switch { width: 40px; height: 24px; border-radius: 12px; background: var(--s3); border: 0; position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { left: 19px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* Ficha del símbolo */
.symhead { display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 14px; border-bottom: 1px solid var(--line); }
.iconbtn { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--c, var(--brand)); display: grid; place-items: center; position: relative; flex: none; }
.iconbtn .pen { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.iconbtn:hover .pen, .iconbtn:focus-visible .pen { opacity: 1; }
.iconbtn .pen svg { width: 12px; height: 12px; }
.titlebox { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.title-in { font-size: 18px; font-weight: 500; border: 0; background: none; padding: 2px 6px; margin-left: -6px; border-radius: 8px; width: 100%; color: var(--ink); text-overflow: ellipsis; }
.title-in:hover { background: var(--s2); }
.title-in:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px var(--brand); }
.spacepick { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; border: 0; background: none; padding: 2px 6px; margin-left: -6px; border-radius: 8px; width: max-content; }
.spacepick:hover { background: var(--s2); color: var(--ink); }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--c); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--ink); }
.sw.custom { background: conic-gradient(#e5645a, #e9a23b, #f2d14b, #5db07f, #6fa9d6, #8f7fd6, #e5645a); position: relative; overflow: hidden; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.palsel { display: flex; align-items: center; gap: 8px; }
.palsel select { border: 1px solid var(--line); border-radius: 10px; height: 34px; background: var(--surface); padding: 0 8px; }
.mod { border-top: 1px solid var(--line); padding-top: 4px; }
.modh { display: flex; align-items: center; gap: 4px; }
.modt { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; text-align: left; }
.modt > svg:first-child { color: var(--brand); }
.modh .modrm { opacity: 0; width: 34px; height: 34px; color: var(--muted); }
.modh:hover .modrm, .modh:focus-within .modrm { opacity: 1; }
.modh .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.modh .t b { font-weight: 500; font-size: 14.5px; }
.modh .t span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modh .chev { color: var(--muted); transition: transform .2s; }
.mod.open .chev { transform: rotate(180deg); }
.modb { display: none; padding: 2px 0 14px 36px; flex-direction: column; gap: 10px; }
.mod.open .modb { display: flex; }
.addmods { display: flex; gap: 6px; flex-wrap: wrap; }
.addmods button { display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line); background: none; border-radius: 10px; padding: 7px 10px; color: var(--muted); font-size: 13px; }
.addmods button:hover { border-color: var(--brand); color: var(--brand); }
.gest { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: center; }
.ctlprev { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; gap: 8px; align-items: center; }
.ctlprev .knob { width: 54px; height: 54px; border-radius: 50%; border: 6px solid var(--brand-soft); border-top-color: var(--brand); display: grid; place-items: center; font-weight: 500; font-size: 13px; }

/* Listas */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
.li:last-child { border-bottom: 0; }
.li .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li .t b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .acts { display: flex; gap: 0; opacity: .0; transition: opacity .15s; }
.li:hover .acts, .li:focus-within .acts, .li.sel .acts { opacity: 1; }
.li .acts .ib { width: 34px; height: 34px; border-radius: 10px; }
.li.sel { background: var(--brand-soft); border-radius: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.ico-tile { width: 36px; height: 36px; border-radius: 10px; background: var(--s2); display: grid; place-items: center; color: var(--c, var(--brand)); flex: none; }
.name-in { border: 0; background: var(--surface); box-shadow: 0 0 0 2px var(--brand); border-radius: 8px; padding: 4px 8px; width: 100%; }

/* Imágenes del plano */
.sets { display: flex; flex-direction: column; gap: 10px; }
.set { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.set.main { border-color: var(--brand); }
.set header { display: flex; align-items: center; gap: 8px; }
.set header b { flex: 1; font-weight: 500; }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.thumb { aspect-ratio: 10 / 7; border-radius: 8px; border: 1px solid var(--line); position: relative; overflow: hidden; display: grid; place-items: center; background: var(--s2); }
.thumb .mode { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.thumb .mode svg { width: 14px; height: 14px; }
.thumb.empty { border-style: dashed; color: var(--muted); font-size: 11.5px; flex-direction: column; gap: 4px; display: flex; align-items: center; justify-content: center; }
.thumb svg.mini { width: 100%; height: 100%; }

/* Panel Ahora */
.nowh { display: flex; align-items: center; gap: 4px; padding: 14px 12px 6px 16px; }
.nowh h2 { font-size: 17px; margin: 0; flex: 1; font-weight: 500; }
.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 12px 24px; overflow: auto; align-content: start; flex: 1; min-height: 0; }
.w { background: var(--surface); border-radius: 14px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); grid-column: span 2; position: relative; min-width: 0; }
.w.half { grid-column: span 1; }
.w h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.w.editing { outline: 2px dashed color-mix(in srgb, var(--edit) 70%, transparent); outline-offset: -2px; cursor: grab; }
.w.dragging { opacity: .4; }
.w .wtools { position: absolute; top: 6px; right: 6px; display: flex; gap: 0; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
.w .wtools .ib { width: 30px; height: 30px; border-radius: 8px; }
.w .wtools .ib svg { width: 16px; height: 16px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--s2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.wlist { display: flex; flex-direction: column; gap: 6px; }
.wlist div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; min-width: 0; }
.wlist div span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.shortcuts { display: flex; gap: 10px; }
.scut { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; font-size: 12px; color: var(--ink); flex: 1; }

/* Popovers */
.pop { position: absolute; z-index: 20; background: var(--surface); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.22); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 320px; }

.gcard:hover { border-color: var(--brand); }

.gcard span { font-size: 12.5px; font-weight: 500; }
.picker { max-height: 190px; overflow: auto; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; }

.menu { min-width: 240px; padding: 6px; gap: 2px; }

.iconsgrid { display: grid; grid-template-columns: repeat(6, 36px); gap: 4px; }

/* Vista */
.curve { width: 100%; height: auto; display: block; }
.curve text { font-size: 10px; fill: var(--muted); }
.iv { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.iv .frame { position: absolute; border: 2px solid var(--brand); border-radius: 4px; background: color-mix(in srgb, var(--brand) 10%, transparent); }

/* Alertas y automatizaciones */
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; line-height: 2.1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px; background: var(--surface); }
.pill.hot { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 25%, transparent); }
.pill input { width: 48px; border: 0; background: none; text-align: right; font-variant-numeric: tabular-nums; }
.pill input:focus { outline: none; }
.sev { display: inline-flex; gap: 6px; }
.sev button { display: inline-flex; align-items: center; gap: 6px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
.sev button.on { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.preview-card { border-radius: 12px; background: var(--bg); padding: 14px; display: flex; align-items: center; gap: 14px; }
.psym { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--brand); position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.18); flex: none; }
.psym.warn { box-shadow: 0 0 0 3px var(--warn); }
.psym .bdg { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: #fff; display: grid; place-items: center; }
.psym .bdg svg { width: 12px; height: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.acard { display: flex; align-items: center; gap: 12px; }
.acard .t { flex: 1; min-width: 0; }
.acard .t b { font-weight: 500; display: block; }
.acard .t .chips { margin-top: 6px; }
.flow { display: flex; flex-direction: column; gap: 0; }
.step { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.step header { display: flex; align-items: center; gap: 8px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; color: var(--c); }
.step header .grow { flex: 1; }
.step .ln { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.step .ln b { font-weight: 500; }
.conn { height: 22px; display: grid; place-items: center; position: relative; }
.conn::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--line); }
.conn button { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--muted); }
.conn button svg { width: 14px; height: 14px; }

/* Guía */
.guide { position: absolute; z-index: 40; width: 280px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 8px; }
.guide b { font-size: 14px; }
.guide p { margin: 0; font-size: 13px; line-height: 1.45; opacity: .9; }
.guide footer { display: flex; align-items: center; gap: 8px; }
.guide footer span { flex: 1; font-size: 12px; opacity: .7; }
.guide button { border: 0; border-radius: 9px; padding: 6px 12px; background: var(--bg); color: var(--ink); font-weight: 500; }
.guide button.ghost { background: none; color: var(--bg); opacity: .75; }
.gfocus { box-shadow: 0 0 0 3px var(--warn) !important; border-radius: 10px; position: relative; z-index: 39; }

/* Estado, datos, ayuda */
.fchips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13px; }

.fchips b { font-variant-numeric: tabular-nums; }
.usage { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--s2); }

.legend { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.legend b { font-weight: 500; font-variant-numeric: tabular-nums; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; color: var(--muted); }

.hcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); text-align: left; }

.states { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
.state { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 40px; background: var(--surface); }
.search input { border: 0; background: none; flex: 1; }
.search input:focus { outline: none; }

/* Notas para el propietario */
.notes { position: absolute; left: 76px; top: 72px; width: 360px; max-height: calc(100% - 90px); overflow: auto; z-index: 50; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.2); padding: 14px 16px; font-size: 13px; }
.notes h3 { margin: 0 0 6px; font-size: 14px; font-weight: 500; }
.notes h4 { margin: 10px 0 4px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.notes .q li::marker { content: "? "; color: var(--edit); font-weight: 700; }

/* Tooltip */
.tip { position: fixed; z-index: 100; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 10px; border-radius: 8px; pointer-events: none; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

/* Teléfono */
@media (max-width: 820px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .side, .side.now { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 62%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); z-index: 10; }
  .side.now { display: none; }
  .activity, .clock { display: none; }
  .top { overflow-x: auto; }
  .notes { left: 8px; right: 8px; width: auto; }
  .screens { display: none; }
  .screen-sel { display: block; }
  .review > div:first-child { display: none; }
  .plan { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ——— Parte 2: menú, indicadores, controles RF/IR ——— */

.screen-sel { display: block !important; flex: 0 1 260px; }

.fx-ring { position: absolute; inset: calc(-1 * (var(--fw) + 3px)); border-radius: 50%; pointer-events: none;
  background: conic-gradient(var(--fa) calc(var(--p) * 1%), var(--fb) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--fw)), #000 calc(100% - var(--fw) + .5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--fw)), #000 calc(100% - var(--fw) + .5px)); }

.fx-num { position: absolute; font-size: 11px; font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 0 5px; line-height: 16px; font-variant-numeric: tabular-nums; }
.fx-num.tr { right: -9px; top: -9px; } .fx-num.br { right: -9px; bottom: -9px; } .fx-num.b { left: 50%; bottom: -19px; transform: translateX(-50%); }

.srow { display: flex; align-items: center; gap: 8px; }

.cap { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; letter-spacing: .04em; border-radius: 6px; padding: 2px 6px; background: var(--s2); color: var(--muted); white-space: nowrap; }
.cap.ir { background: color-mix(in srgb, #b2577f 16%, var(--surface)); color: #b2577f; }

.nodes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.node { flex: none; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 26px 10px 12px; text-align: left; }

.node .caps { display: flex; gap: 4px; }
.okcard { flex-direction: row; align-items: center; color: var(--ok); animation: pop .4s ease; }
.okcard b { color: var(--ink); font-weight: 500; }
.stepper { display: flex; align-items: center; gap: 4px; }

.st.cur span { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }

.kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

@keyframes wave { from { transform: scale(1); opacity: .6; } to { transform: scale(1.9); opacity: 0; } }
.listen-t { text-align: center; display: flex; flex-direction: column; gap: 2px; }

.caps-list { display: flex; flex-direction: column; gap: 8px; }

.tune { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 4px 10px; color: var(--muted); animation: pop .35s ease; }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--s2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.facts span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.facts b { font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.timeline { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }

.etypes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.etype { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px dashed var(--line); background: none; border-radius: 10px; padding: 8px 4px; font-size: 11.5px; color: var(--muted); }

.rprev { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--bg); border-radius: 14px; padding: 12px; cursor: pointer; }
.pe { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border-radius: 10px; height: 40px; font-size: 12px; }

.remote { width: 340px; max-width: calc(100% - 32px); background: var(--surface); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.18); padding: 18px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 70px; animation: pop .35s ease; }

.pairb { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
.pl { display: flex; flex-direction: column; align-items: center; }

.optl { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; align-self: flex-start; }

};

function curveSVG() {
  const W = 320, H = 120, x0 = 34, x1 = W - 10, y0 = 10, y1 = H - 24, zmax = 2.8;
  const { min, max } = S.sizes;
  const X = z => x0 + ((z - 1) / (zmax - 1)) * (x1 - x0);
  const Y = p => y1 - ((p - (min - 10)) / (max + 10 - (min - 10))) * (y1 - y0);
  const pts = []; for (let z = 1; z <= zmax + 0.001; z += 0.1) pts.push(`${X(z).toFixed(1)},${Y(curvePct(z) * 100).toFixed(1)}`);
  const cz = clamp(S.zoom, 1, zmax);
  return `<svg class="curve" id="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tamaño según el zoom">
    <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" style="stroke:var(--line)"/><line x1="${x0}" y1="${Y(100)}" x2="${x1}" y2="${Y(100)}" style="stroke:var(--line)" stroke-dasharray="3 4"/>
    <line x1="${X(ZR)}" y1="${y0}" x2="${X(ZR)}" y2="${y1}" style="stroke:var(--line)" stroke-dasharray="3 4"/>
    <text x="${x0}" y="${H - 8}">Casa</text><text x="${X(ZR)}" y="${H - 8}" text-anchor="middle">Espacio</text><text x="${x0 - 6}" y="${Y(100) + 3}" text-anchor="end">100%</text>
    <polyline points="${pts.join(' ')}" style="stroke:var(--brand)" stroke-width="2.5" fill="none"/>
    <circle cx="${X(cz)}" cy="${Y(curvePct(cz) * 100)}" r="6" style="fill:var(--brand);stroke:var(--surface)" stroke-width="2"/></svg>`;
}

  if (S.homes && S.mode === 'view') {

      <button type="button" class="mi" data-act="home:Casa de la playa">${ic('mdiBeach')}<span class="grow">Casa de la playa</span>${S.home === 'Casa de la playa' ? ic('mdiCheck') : ''}</button><hr>

  }
  if (S.pop === 'icon') html += `<div class="pop" style="${near('#iconbtn')}"><h4>${ic('mdiShapeOutline', 'sm')}Icono</h4><label class="search">${ic('mdiMagnify')}<input placeholder="Buscar" aria-label="Buscar icono"></label><div class="iconsgrid">${ICON_CHOICES.map(n => ib('seticon:' + n, n, n.replace('mdi', ''), D()?.icon === n ? 'on' : '')).join('')}</div></div>`;
  if (S.pop === 'space') html += `<div class="pop menu" style="${near('.spacepick')}">${SPACES.map(s => `<button type="button" class="mi" data-act="setspace:${s.id}">${ic(s.icon)}<span class="grow">${esc(s.name)}</span>${D()?.sp === s.id ? ic('mdiCheck') : ''}</button>`).join('')}</div>`;
  if (S.gallery && S.mode === 'edit' && S.tool === 'now') {
    const r = $('#side').getBoundingClientRect();
    html += `<div class="pop" style="left:${r.left - app.left - 340}px;top:${r.top - app.top + 10}px"><h4>${ic('mdiPlus', 'sm')}Agregar bloque</h4><div class="gallery">${Object.entries(WTYPES).map(([k, w]) => `<button type="button" class="gcard" data-act="w-new:${k}"><span class="gprev">${ic(w.icon, 'lg')}</span><span>${w.t}</span></button>`).join('')}</div></div>`;
  }
  if (S.wset && S.mode === 'edit' && S.tool === 'now') {
    const w = WIDGETS.find(x => x.id === S.wset), el = document.querySelector(`[data-w="${S.wset}"]`);
    if (w && el) {
      const r = el.getBoundingClientRect();
      const items = w.type === 'clima' ? SPACES.map(s => s.name) : DEV.map(d => d.name);
      html += `<div class="pop" style="left:${r.left - app.left - 330}px;top:${Math.max(8, r.top - app.top)}px;width:320px"><h4>${ic(WTYPES[w.type].icon, 'sm')}${WTYPES[w.type].t}<span class="grow"></span>${ib('w-set:' + w.id, 'mdiCheck', 'Listo')}</h4>
        <input class="field" id="w-title" value="${esc(w.title || WTYPES[w.type].t)}" data-bind="wtitle" aria-label="Título">
        <div class="seg">${[['list', 'mdiFormatListBulleted', 'Lista'], ['tiles', 'mdiViewGridOutline', 'Mosaico'], ['graph', 'mdiChartLine', 'Gráfico']].map((o, i) => ib('x', o[1], o[2], i === (w.type === 'clima' ? 1 : 0) ? 'on' : '')).join('')}</div>
        <label class="search">${ic('mdiMagnify')}<input placeholder="Buscar" aria-label="Buscar"></label>
        <div class="picker">${items.map((n, i) => `<label><input type="checkbox" ${i < 4 ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div></div>`;
    }
  }
  if (S.confirmExit) html += `<div class="pop" style="right:12px;top:56px;width:280px"><h4>${ic('mdiContentSaveAlertOutline', 'sm')}${S.dirty} cambios sin guardar</h4><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="chip" data-act="exit-discard" style="padding:6px 12px">Descartar</button><button type="button" class="chip" data-act="exit-save" style="padding:6px 12px;background:var(--brand);color:var(--on-brand);border-color:var(--brand)">Guardar</button></div></div>`;
  html += extraPops(app, near);
  host.innerHTML = html;
}

function renderGuide() {
