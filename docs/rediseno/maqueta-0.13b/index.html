<title>HomeManager 0.13b maqueta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>/* HomeManager 0.13 · segunda parte. Mismo sistema que la maqueta aprobada: el plano siempre
   a la vista, un panel al costado que se navega como un cuaderno, íconos con ayuda al pasar. */
:root {
  --bg: #f4f5f0; --surface: #ffffff; --ink: #1f2a24; --muted: #5f6e66; --line: #dde2d8;
  --brand: #4f7a5a; --on-brand: #ffffff; --edit: #c77700; --edit-ink: #7a4300;
  --alert: #d0453a; --warn: #d98b1f; --ok: #3f8f5f; --cool: #4f8fbf;
  --wall: #3e4b43; --floor: #efe9dc; --floor-wood: #e6d3b5; --floor-tile: #e8ebe6;
  --font: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.09);
  --s2: color-mix(in srgb, var(--ink) 6%, transparent);
  --s3: color-mix(in srgb, var(--ink) 11%, transparent);
  --brand-soft: color-mix(in srgb, var(--brand) 14%, var(--surface));
  --edit-soft: color-mix(in srgb, #e8a33d 20%, var(--bg));
  --sp1: #7fa37a; --sp2: #d9a35f; --sp3: #6f9fc9; --sp4: #b38bc0; --sp5: #c9c06f; --sp6: #6fb8ad; --sp7: #d98a8a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1b221e; --ink: #e8ece6; --muted: #9aa59f; --line: #2c3530;
    --brand: #8fb38b; --on-brand: #121714; --edit: #f0b455; --edit-ink: #f7cd86;
    --alert: #e5645a; --warn: #e9a23b; --ok: #5db07f; --cool: #6fa9d6;
    --wall: #9fb0a5; --floor: #26302a; --floor-wood: #3a3227; --floor-tile: #252c28;
    --edit-soft: color-mix(in srgb, #f0b455 16%, var(--bg)); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1b221e; --ink: #e8ece6; --muted: #9aa59f; --line: #2c3530;
  --brand: #8fb38b; --on-brand: #121714; --edit: #f0b455; --edit-ink: #f7cd86;
  --alert: #e5645a; --warn: #e9a23b; --ok: #5db07f; --cool: #6fa9d6;
  --wall: #9fb0a5; --floor: #26302a; --floor-wood: #3a3227; --floor-tile: #252c28;
  --edit-soft: color-mix(in srgb, #f0b455 16%, var(--bg)); color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 12px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; display: block; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 26px; height: 26px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ——— Barra de revisión (no es parte de la app) ——— */
.review { display: flex; align-items: center; gap: 12px; padding: 10px 0; flex-wrap: wrap; }
.rv-title { display: grid; gap: 1px; } .rv-title b { font-size: 13px; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.screens { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.screens button, .notes-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; white-space: nowrap; }
.screens button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.screens button b { font-variant-numeric: tabular-nums; margin-right: 4px; color: var(--muted); }
.screens button[aria-current="true"] b { color: inherit; opacity: .7; }
.notes-btn[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

/* ——— Marco de la app ——— */
.app { flex: 1; min-height: 600px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); position: relative; }
.top { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.top .home { display: flex; align-items: center; gap: 8px; font-weight: 500; padding: 6px 10px; border-radius: 10px; border: 0; background: transparent; }
.clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
.ib { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); flex: none; padding: 0; }
.ib:hover:not(:disabled) { background: var(--s2); }
.ib:disabled { opacity: .32; cursor: default; }
.ib[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.ib.primary { background: var(--brand); color: var(--on-brand); }
.ib.primary:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.ib.danger { color: var(--alert); }
.ib.sm { width: 30px; height: 30px; border-radius: 8px; }
.editband { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--edit-soft); border-bottom: 1px solid color-mix(in srgb, var(--edit) 35%, var(--line)); color: var(--edit-ink); font-size: 13px; font-weight: 500; flex: none; }
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.stage { flex: 1; min-width: 0; position: relative; background: var(--bg); display: grid; place-items: center; overflow: hidden; }
.side { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.side.wide { width: 320px; }

/* ——— Plano de ejemplo ——— */
.plan { width: min(100% - 32px, 760px); aspect-ratio: 3 / 2; position: relative; }
.plan svg { width: 100%; height: 100%; display: block; }
.room { stroke: var(--wall); stroke-width: 5; stroke-linejoin: round; }
.symbol { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.18); display: grid; place-items: center; color: var(--ink); border: 0; padding: 0; }
.symbol.on { color: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 45%, transparent), 0 1px 4px rgba(0,0,0,.18); }

/* ——— Panel lateral: el cuaderno ——— */
.nb { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); }
.page.in-right { animation: inRight .26s cubic-bezier(.2,.7,.2,1) both; } .page.out-left { animation: outLeft .26s ease both; }
.page.in-left { animation: inLeft .26s cubic-bezier(.2,.7,.2,1) both; } .page.out-right { animation: outRight .26s ease both; }
@keyframes inRight { from { transform: translateX(100%); } to { transform: none; } }
@keyframes outLeft { from { transform: none; opacity: 1; } to { transform: translateX(-28%); opacity: 0; } }
@keyframes inLeft { from { transform: translateX(-28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes outRight { from { transform: none; } to { transform: translateX(100%); } }
.phead { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); min-height: 58px; flex: none; }
.phead h2 { font-size: 17px; font-weight: 500; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb { font-size: 11.5px; color: var(--muted); display: block; font-weight: 400; }
.htile { width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.pbody { flex: 1; overflow: auto; padding: 6px 0 16px; scrollbar-width: thin; }
.grp { padding: 14px 18px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 48px; padding: 8px 16px 8px 18px; border: 0; background: transparent; text-align: left; }
.row:hover { background: var(--s2); }
.row .t { flex: 1; min-width: 0; } .row .t small { display: block; color: var(--muted); font-size: 12px; }
.row > svg:first-child { color: var(--brand); }
.row .chev { color: var(--muted); }
.row.soon { opacity: .55; }
.card { margin: 10px 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: 10px; }
.card.soft { place-items: center; color: var(--muted); min-height: 120px; border-style: dashed; }
.field { display: flex; align-items: center; gap: 10px; }
.field > span { flex: 1; }
.mini { margin: 10px 16px; border-radius: 16px; background: var(--bg); display: grid; place-items: start center; padding: 12px; overflow: hidden; }
.mini-in { transform-origin: top center; pointer-events: none; }
.switch { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--s3); position: relative; cursor: pointer; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch:checked { background: var(--brand); } .switch:checked::after { transform: translateX(16px); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--s2); gap: 2px; flex-wrap: wrap; max-width: 100%; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 4px 9px; display: flex; align-items: center; gap: 5px; font-size: 12.5px; min-height: 28px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.14); color: var(--ink); font-weight: 500; }
.seg.icons button { padding: 4px 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; background: var(--surface); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 500; }
.chip.wide { width: 100%; justify-content: flex-start; }
.chip.wide > svg:last-child { margin-left: auto; }
.tin { width: 100%; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 9px; font-size: 13px; }
.tin:focus { border-color: var(--brand); outline: 0; }
.muted { color: var(--muted); }

/* ——— Notas y avisos ——— */
.notes { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: 60px; bottom: 16px; width: min(460px, calc(100% - 32px)); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; z-index: 20; line-height: 1.55; }
.notes h3 { margin: 18px 0 6px; font-size: 15px; } .notes h3:first-child { margin-top: 0; }
.notes p, .notes li { font-size: 13.5px; } .notes ul { padding-left: 18px; margin: 6px 0; }
.notes table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
.notes td, .notes th { border-bottom: 1px solid var(--line); padding: 5px 4px; text-align: left; vertical-align: top; }
.notes th { color: var(--muted); font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; pointer-events: none; z-index: 30; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.veil { position: absolute; inset: 0; background: color-mix(in srgb, #000 32%, transparent); z-index: 9; display: grid; place-items: center; padding: 16px; }
.sheet { width: min(380px, 100%); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.sheet .acts { display: flex; justify-content: flex-end; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

@media (max-width: 760px) {
  .side { position: absolute; inset: 0; width: auto; border-left: 0; z-index: 5; }
  .side.closed, .side.hide-phone { display: none; }
  .body:has(.sheet-phone) { flex-direction: column; }
  .side.sheet-phone { position: relative; inset: auto; height: 50%; flex: none; border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.1); border-radius: 16px 16px 0 0; }
  .screens { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; flex-basis: 100%; order: 3; }
  .review { gap: 8px; }
  .clock { display: none; }
}

/* ——— Editor del plano ——— */
.pe-stage { place-items: center; }
.pe { position: relative; width: min(100% - 120px, 900px); aspect-ratio: 3 / 2; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.pe > svg { border-radius: 10px; }
.pe > svg { width: 100%; height: 100%; display: block; }
.pe[data-tool=rect] > svg, .pe[data-tool=poly] > svg, .pe[data-tool=cut] > svg { cursor: crosshair; }
.pe[data-tool=pan] > svg { cursor: grab; }
.ps { fill: color-mix(in srgb, var(--c) 42%, transparent); stroke: color-mix(in srgb, var(--c) 70%, var(--ink)); stroke-width: 1.5; vector-effect: non-scaling-stroke; fill-rule: evenodd; cursor: pointer; transition: fill .12s; }
.ps.hov { fill: color-mix(in srgb, var(--c) 56%, transparent); }
.ps.sel { fill: color-mix(in srgb, var(--c) 58%, transparent); stroke: var(--brand); stroke-width: 2.5; }
.pbox { fill: none; stroke: var(--brand); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
.ph { fill: var(--surface); stroke: var(--brand); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ph.nw, .ph.se { cursor: nwse-resize; } .ph.ne, .ph.sw { cursor: nesw-resize; } .ph.n, .ph.s { cursor: ns-resize; } .ph.e, .ph.w { cursor: ew-resize; }
.pv { fill: var(--surface); stroke: var(--brand); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: move; }
.pv.on { fill: var(--brand); }
.pmid { fill: var(--brand); opacity: .45; cursor: copy; } .pmid:hover { opacity: 1; }
.pdraft { fill: color-mix(in srgb, var(--brand) 16%, transparent); stroke: var(--brand); stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.pmarq { fill: color-mix(in srgb, var(--cool) 12%, transparent); stroke: var(--cool); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
.pcut { stroke: var(--alert); stroke-width: 2; stroke-dasharray: 7 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.pguide { stroke: #d14fa0; stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
.plabels { position: absolute; inset: 0; pointer-events: none; }
.plbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; border: 0; border-radius: 10px; padding: 4px 10px; display: grid; justify-items: center; line-height: 1.15; background: color-mix(in srgb, var(--surface) 86%, transparent); box-shadow: 0 1px 3px rgba(0,0,0,.14); cursor: pointer; white-space: nowrap; }
.plbl b { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.plbl b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.plbl small { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.plbl.sel { box-shadow: 0 0 0 2px var(--brand); }
.plbl.edit input { border: 0; outline: 0; background: transparent; font-weight: 500; width: 9em; text-align: center; padding: 2px 0; }
.pe[data-tool=rect] .plbl, .pe[data-tool=poly] .plbl, .pe[data-tool=cut] .plbl, .pe[data-tool=pan] .plbl { pointer-events: none; opacity: .7; }
.pmeas { position: absolute; transform: translate(-50%, 8px); padding: 2px 8px; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
.vtools { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: grid; gap: 2px; padding: 4px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); z-index: 3; }
.pe-tr { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); z-index: 3; }
.pe-tr input[type=range] { width: 84px; accent-color: var(--brand); }
.pe-zoom { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); z-index: 3; }
.zpct { border: 0; background: transparent; min-width: 50px; font-size: 12px; font-variant-numeric: tabular-nums; padding: 6px 4px; border-radius: 8px; }
.zpct:hover { background: var(--s2); }
.pctx.below { transform: translate(-50%, 16px); }
.pctx { position: absolute; transform: translate(-50%, calc(-100% - 12px)); display: flex; align-items: center; gap: 1px; padding: 3px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); z-index: 4; white-space: nowrap; }
.pctx .ib { color: var(--bg); width: 34px; height: 34px; } .pctx .ib:hover { background: color-mix(in srgb, var(--bg) 16%, transparent); }
.pctx .ib.danger { color: #ff8b80; }
.pctx .sep { width: 1px; height: 20px; margin: 0 3px; background: color-mix(in srgb, var(--bg) 25%, transparent); }
.palign { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--ink); }
.pkeys { position: absolute; right: 12px; top: 60px; z-index: 6; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12.5px; }
kbd { font: 11.5px var(--mono); padding: 2px 6px; border-radius: 6px; background: var(--s2); border: 1px solid var(--line); white-space: nowrap; justify-self: start; }
.pins { display: grid; gap: 10px; padding: 12px 16px 6px; }
.prow { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; color: var(--muted); }
.prow .tin { color: var(--ink); }
.pgrid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pgrid4 > * { min-width: 0; }
.pnum { min-width: 0; display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); }
.pnum input { flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; outline: 0; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.pnum span { font-size: 11.5px; }
.pstats { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; }
.pstats span { display: flex; align-items: center; gap: 5px; } .pstats b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.pmulti { font-size: 13px; color: var(--muted); } .pmulti b { font-size: 20px; color: var(--ink); font-weight: 500; margin-right: 4px; }
.pops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pop-op { display: grid; justify-items: center; gap: 4px; padding: 12px 4px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 12.5px; }
.pop-op svg { color: var(--brand); } .pop-op:hover { border-color: var(--brand); background: var(--brand-soft); }
.players { display: grid; padding: 0 8px 8px; }
.player { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
.player i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.player small { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.player:hover { background: var(--s2); } .player.on { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
@media (max-width: 760px) {
  .pe { width: calc(100% - 8px); }
  .vtools { left: 6px; top: auto; bottom: 8px; transform: none; display: flex; }
  .pe-zoom { bottom: 64px; right: 6px; } .pe-tr { right: 6px; top: 6px; }
}

/* ——— Diseñador de controles ——— */
.dbar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex: none; position: relative; flex-wrap: wrap; }
.rpick { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 6px 10px; border-radius: 10px; font-size: 15px; }
.rpick:hover { background: var(--s2); } .rpick b { font-weight: 500; }
.srcpill { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--s2); color: var(--muted); letter-spacing: .04em; }
.dmode { margin-left: 6px; }

  box-shadow: 0 28px 50px -22px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 0 rgba(0,0,0,.18); }

.gcell { border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--rfg) 16%, transparent); pointer-events: none; }

<script>/* HomeManager 0.13 · segunda parte — maqueta interactiva con datos inventados. */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${(window.HM_ICONS || {})[n] || ''}"/></svg>`;
const ib = (label, icon, attrs = '', cls = '') => `<button type="button" class="ib ${cls}" aria-label="${esc(label)}" title="${esc(label)}" ${attrs}>${ic(icon)}</button>`;
let toastTimer;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1700);
}
const SCREENS = [['menu', 'Menú cuaderno'], ['plano', 'Editor del plano'], ['controles', 'Diseñador de controles'], ['pegados', 'Controles en el plano']];
let screen = SCREENS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : 'menu';
function nav() {
  $('#screens').innerHTML = SCREENS.map(([id, name], i) => `<button type="button" data-screen="${id}" aria-current="${id === screen}"><b>${i + 1}</b>${esc(name)}</button>`).join('');
}
$('#screens').addEventListener('click', e => {
  const b = e.target.closest('[data-screen]');
  if (b) go(b.dataset.screen);
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (SCREENS.some(([s]) => s === id) && id !== screen) { screen = id; render(); }
});
function go(id) {
  screen = id;
  history.replaceState(null, '', '#' + id);
  render();
}
function topBar({ edit = false, gear = false } = {}) {
  return `<div class="top"><button type="button" class="home">${ic('mdiHomeOutline')}Casa de prueba${ic('mdiChevronDown', 'sm')}</button><span class="grow" style="flex:1"></span><span class="clock">18:42</span>${ib('Tema claro u oscuro', 'mdiWeatherNight', 'data-top="theme"')}${ib('Editar el plano', 'mdiPencilOutline', `data-top="edit" aria-pressed="${edit}"`)}${ib('Configuración', 'mdiCogOutline', `data-top="gear" aria-pressed="${gear}"`)}</div>`;
}
function toggleTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
}
const ROOMS = [['M20 20H300V230H200V380H20Z', 'var(--floor)'], ['M200 230H300V380H200Z', 'var(--floor-tile)'], ['M300 20H580V230H300Z', 'var(--floor-wood)'], ['M300 230H430V380H300Z', 'var(--floor-tile)'], ['M430 230H580V380H430Z', 'var(--floor)']];
const planSvg = (extra = '') => `<svg viewBox="0 0 600 400" aria-hidden="true">${ROOMS.map(([d, f]) => `<path class="room" d="${d}" fill="${f}"/>`).join('')}${extra}</svg>`;
const sym = (x, y, icon, on = false, attrs = '') => `<button type="button" class="symbol${on ? ' on' : ''}" style="left:${(x / 600) * 100}%;top:${(y / 400) * 100}%" ${attrs}>${ic(icon)}</button>`;

/* ═════════ 1 · Menú cuaderno ═════════ */
const M = { stack: ['root'], open: true, edit: false };
const ROW = (id, name, icon, sub = '', soon = false) => ({ id, name, icon, sub, soon });
const PAGES = {
  root: { title: 'Configuración', groups: [
    ['Mi casa', [ROW('plano', 'Plano y espacios', 'mdiFloorPlan', '6 espacios'), ROW('hogares', 'Hogares', 'mdiHomeOutline', '2 casas')]],
    ['Pantallas', [ROW('ahora', 'Panel Ahora', 'mdiViewDashboardOutline'), ROW('apariencia', 'Apariencia', 'mdiPaletteOutline'), ROW('tamano', 'Tamaño y vista', 'mdiMagnifyExpand')]],
    ['Controles', [ROW('controles', 'Controles', 'mdiRemote', '3 controles'), ROW('equipos', 'Equipos', 'mdiChip', 'Athom A · Athom B')]],
    ['Avisos', [ROW('alertas', 'Alertas', 'mdiBellOutline', '2 activas'), ROW('auto', 'Automatizaciones', 'mdiRobotOutline', '', true)]],
    ['Mantenimiento', [ROW('estado', 'Estado de la casa', 'mdiClipboardCheckOutline'), ROW('copias', 'Almacenamiento y copias', 'mdiDatabaseOutline')]],
    ['Avanzado', [ROW('acciones', 'Acciones y paneles', 'mdiCodeBraces'), ROW('ayuda', 'Ayuda', 'mdiHelpCircleOutline')]],
  ] },
  plano: { title: 'Plano y espacios', groups: [['', [ROW('editar', 'Editar dibujo y espacios', 'mdiVectorPolylineEdit'), ROW('imagenes', 'Imágenes del plano', 'mdiImageMultipleOutline', '3 imágenes'), ROW('areas', 'Áreas de Home Assistant', 'mdiHomeAssistant', '5 de 6 vinculadas')]]] },
  controles: { title: 'Controles', groups: [['', [ROW('r-tv', 'TV living', 'mdiTelevision', 'IR · 26 botones'), ROW('r-aire', 'Aire living', 'mdiAirConditioner', 'IR · 11 botones'), ROW('r-vent', 'Ventilador living', 'mdiCeilingFan', 'RF · 7 botones')]]] },
  apariencia: { title: 'Apariencia', custom: 'look' },
};
for (const id of ['tv', 'aire', 'vent']) PAGES['r-' + id] = { title: '', custom: 'remote', remote: id };
const titleOf = id => {
  if (PAGES[id]?.remote) return DS.r[PAGES[id].remote].name;
  if (PAGES[id]?.title) return PAGES[id].title;
  for (const p of Object.values(PAGES)) for (const [, rows] of p.groups ?? []) for (const r of rows) if (r.id === id) return r.name;
  return id;
};
function pageHtml(id) {
  const p = PAGES[id] ?? { custom: 'empty' };
  const depth = M.stack.indexOf(id);
  const parent = depth > 0 ? titleOf(M.stack[depth - 1]) : '';
  const head = `<div class="phead">${depth > 0 ? ib('Atrás', 'mdiArrowLeft', 'data-nb="back"') : ''}<h2>${parent ? `<span class="crumb">${esc(parent)}</span>` : ''}${esc(titleOf(id))}</h2>${id === 'controles' ? ib('Nuevo control', 'mdiPlus') : ''}${ib('Cerrar', 'mdiClose', 'data-nb="close"')}</div>`;
  let body = '';
  if (p.groups) body = p.groups.map(([g, rows]) => `${g ? `<div class="grp">${esc(g)}</div>` : ''}${rows.map(r => `<button type="button" class="row${r.soon ? ' soon' : ''}" data-nb="${r.id}">${ic(r.icon)}<span class="t">${esc(r.name)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</span>${r.soon ? ic('mdiClockOutline', 'chev') : ic('mdiChevronRight', 'chev')}</button>`).join('')}`).join('');
  else if (p.custom === 'look') body = `<div class="card"><div class="field">${ic('mdiWeatherNight')}<div class="seg"><button aria-pressed="true">Automático</button><button>Claro</button><button>Oscuro</button></div></div><div class="field">${ic('mdiInformationOutline')}<span>Ayudas al pasar el mouse</span><input type="checkbox" class="switch" checked aria-label="Ayudas"></div></div>`;
  else if (p.custom === 'remote') {
    const r = DS.r[p.remote];
    body = `<div class="mini"><div class="mini-in"><div class="rmt theme-${r.theme} testing" style="--cols:${r.cols};--rows:${r.rows};--cell:60px;--gap:${r.gap}px;--rrad:${r.rrad}px">${r.els.map(e => renderEl(e)).join('')}</div></div></div>${[['Diseñar', 'mdiPencilRuler', 'design'], ['Aprender botones', 'mdiAccessPoint', 'x'], ['Probar botones', 'mdiPlayCircleOutline', 'x'], ['Duplicar para otro aparato', 'mdiContentDuplicate', 'x'], ['Emisor y ajustes', 'mdiTuneVariant', 'x']].map(([t, i, k]) => `<button type="button" class="row" data-nb="${k === 'design' ? 'design:' + p.remote : 'x'}">${ic(i)}<span class="t">${esc(t)}</span>${ic('mdiChevronRight', 'chev')}</button>`).join('')}`;
  } else body = `<div class="card soft">${ic('mdiFileDocumentOutline', 'lg')}</div>`;
  return `${head}<div class="pbody">${body}</div>`;
}
function renderMenu() {
  $('#app').innerHTML = `${topBar({ edit: M.edit, gear: M.open })}${M.edit ? `<div class="editband">${ic('mdiPencilOutline', 'sm')}<span>Edición</span><span style="flex:1"></span>${ib('Guardar', 'mdiCheck', 'data-top="edit"', 'sm primary')}</div>` : ''}<div class="body"><div class="stage"><div class="plan">${planSvg()}${sym(90, 70, 'mdiLightbulbOutline', true)}${sym(150, 150, 'mdiCeilingFan')}${sym(440, 110, 'mdiAirConditioner', true)}${sym(360, 300, 'mdiThermometer')}${sym(500, 320, 'mdiFlowerOutline')}</div></div><aside class="side${M.open ? '' : ' closed'}" id="side"><div class="nb" id="nb"><div class="page">${M.open ? pageHtml(M.stack.at(-1)) : ahoraHtml()}</div></div></aside></div>`;
  fitMini();
}
function fitMini() {
  for (const box of $$('.mini')) {
    const inner = box.querySelector('.mini-in'), r = inner.firstElementChild;
    const k = Math.min(1, (box.clientWidth - 24) / r.offsetWidth, 300 / r.offsetHeight);
    inner.style.transform = `scale(${k})`;
    box.style.height = `${r.offsetHeight * k + 24}px`;
  }
}
const ahoraHtml = () => `<div class="phead"><h2>Ahora</h2></div><div class="pbody"><div class="grp">Clima</div><div class="row">${ic('mdiThermometer')}<span class="t">Living</span><b>23,4°</b></div><div class="grp">Encendidos</div><div class="row">${ic('mdiLightbulbOutline')}<span class="t">Lámpara<small>Living</small></span></div><div class="row">${ic('mdiAirConditioner')}<span class="t">Aire<small>Dormitorio · frío 24°</small></span></div></div>`;
function slide(toId, dir) {
  const nb = $('#nb');
  const old = nb.querySelector('.page');
  const next = document.createElement('div');
  next.className = 'page ' + (dir === 'fwd' ? 'in-right' : 'in-left');
  next.innerHTML = pageHtml(toId);
  old.className = 'page ' + (dir === 'fwd' ? 'out-left' : 'out-right');
  if (dir === 'back') nb.prepend(next); else nb.append(next);
  fitMini();
  setTimeout(() => { old.remove(); next.className = 'page'; }, 270);
}
function bindMenu() {
  $('#app').onclick = e => {
    const t = e.target.closest('[data-top],[data-nb]');
    if (!t) return;
    if (t.dataset.top === 'gear') { M.open = !M.open; if (M.open) M.stack = ['root']; return renderMenu(); }
    if (t.dataset.top === 'edit') { M.edit = !M.edit; return renderMenu(); }
    if (t.dataset.top === 'theme') return toggleTheme();
    const id = t.dataset.nb;
    if (!id) return;
    if (id === 'close') { M.open = false; return renderMenu(); }
    if (id === 'back') { M.stack.pop(); return slide(M.stack.at(-1), 'back'); }
    if (id.startsWith('design:')) { DS.cur = id.slice(7); DS.sel = []; return go('controles'); }
    if (id === 'editar') return go('plano');
    if (id === 'x' || t.classList.contains('soon')) return;
    M.stack.push(id);
    slide(id, 'fwd');
  };
}

function render() {
  nav();
  const app = $('#app');
  for (const k of ['onclick', 'ondblclick', 'oninput', 'onchange', 'onpointerdown', 'onpointermove', 'onpointerup', 'ondragstart', 'ondragover', 'ondragleave', 'ondrop', 'ondragend']) app[k] = null;
  if (screen === 'menu') { renderMenu(); bindMenu(); }
  else if (screen === 'plano') { renderPlano(); bindPlano(); }
  else if (screen === 'controles') { renderControles(); bindControles(); }
  else { renderPegados(); bindPegados(); }
}

/* ═════════ 2 · Editor del plano ═════════
   Formas de lados rectos (rectángulos o polígonos). Cada forma es un espacio.
   Operaciones como en un programa de dibujo: unir (un solo contorno), restar,
   intersecar, cortar con un trazo, editar puntos, mover, escalar, girar, alinear. */
const UM = 0.02; // metros por unidad: el plano mide 12 × 8 m
const fm = v => (v * UM).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fm2 = v => (v * UM * UM).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const SPC = ['var(--sp1)', 'var(--sp2)', 'var(--sp3)', 'var(--sp4)', 'var(--sp5)', 'var(--sp6)', 'var(--sp7)'];
const rectG = (x, y, w, h) => [[[x, y], [x + w, y], [x + w, y + h], [x, y + h]]];
const PE0 = () => [
  { id: 'a1', name: 'Living', color: 'var(--sp1)', geom: [[[24, 24], [296, 24], [296, 226], [196, 226], [196, 376], [24, 376]]] },
  { id: 'a2', name: 'Cocina', color: 'var(--sp2)', geom: rectG(204, 234, 92, 142) },
  { id: 'a3', name: 'Dormitorio', color: 'var(--sp3)', geom: rectG(304, 24, 272, 202) },
  { id: 'a7', name: 'Vestidor', color: 'var(--sp7)', geom: rectG(486, 120, 90, 106) },
  { id: 'a4', name: 'Baño', color: 'var(--sp4)', geom: rectG(304, 234, 122, 142) },
  { id: 'a5', name: 'Balcón', color: 'var(--sp5)', geom: rectG(446, 250, 130, 126) },
];
const PE = { shapes: PE0(), sel: [], tool: 'select', hist: [], fut: [], vx: 0, vy: 0, zoom: 1, snap: true, img: true, imgOp: 0.6, vsel: null, drag: null, draft: null, poly: null, hover: null, guides: [], rename: null, pop: null, n: 10, space: false, areas: false };

/* — geometría — */
const ringsOf = g => g;
const bboxOf = geoms => {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const g of geoms) for (const r of g) for (const [x, y] of r) {
    x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y);
  }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1, x2, y2, cx: (x1 + x2) / 2, cy: (y1 + y2) / 2 };

function dsKeys(ev) {

/* ═════════ 4 · Controles en el plano ═════════

/** El plano se dibuja en 600 × 400 y se escala entero: letras, íconos y bordes juntos. */

function bindPegados() {
  const app = $('#app');

    const from = t.closest('[data-addfrom]');
    if (from) {

    if (!AT.edit) return;

/* ═════════ Notas de diseño (solo para revisar la maqueta) ═════════ */
$('#notes').innerHTML = `<h3>Cómo se pensó</h3>
<p>Cada pantalla parte de su misión y de cómo lo resuelven herramientas que la gente ya conoce: programas de dibujo como Figma o Illustrator para el plano, editores de mapas de aspiradoras robot y apps de planos para los espacios, y diseñadores de controles universales para los controles. En pantalla no hay explicaciones: cada ícono dice qué hace al pasar el mouse, y los atajos están en el botón del teclado.</p>
<h3>1 · Menú cuaderno</h3>
<ul><li>Una sola puerta, la ruedita ⚙, con el menú clásico de ícono y nombre.</li>
<li>Cada opción entra deslizándose en el mismo panel y ← vuelve. Arriba queda el camino.</li>
<li>La página de un control muestra el control real, el mismo del diseñador.</li></ul>
<h3>2 · Editor del plano</h3>
<ul><li><b>Cada espacio es una forma de lados rectos.</b> No hay listas de cuartos: todo se hace sobre el dibujo.</li>
<li><b>Unir</b> deja un solo contorno, sin líneas adentro. Si las formas no se tocan, rellena lo que hay entre sus bordes más cercanos y quedan como una sola (probalo con Baño y Balcón).</li>
<li><b>Restar</b> le quita al primero lo que tapan los otros (Dormitorio menos Vestidor). <b>Intersecar</b> deja solo lo común.</li>
<li><b>Cortar con un trazo</b>: se dibuja una línea a través de una o varias formas y cada una queda en dos.</li>
<li><b>Editar puntos</b> (doble clic): mover un punto, agregar uno tocando el medio de un lado, quitarlo con Supr.</li>
<li>Rectángulo y forma libre, mover, agrandar desde 8 manijas (Shift mantiene la proporción), girar 90°, voltear, duplicar, adelante y atrás, y alinear varias.</li>
<li>Imán con la grilla y con las otras formas, con líneas guía. Medidas en metros mientras se dibuja, superficie en m² en cada espacio, zoom, mover la vista e imagen del plano con transparencia.</li>
<li>Deshacer y rehacer todo. Atajos: V, A, R, P, K, H, Ctrl+U, Ctrl+D, Supr, flechas.</li></ul>
<h3>3 · Diseñador de controles</h3>
<p><b>Lo que la maqueta anterior había sacado y vuelve:</b> botones aprendidos para arrastrar al control, con aviso de los que no se usan; tamaño de la grilla; mover y agrandar arrastrando; secuencias con veces y pausas; modo prueba; ordenar automáticamente; deshacer; color a elección; posición con números; aprender más botones desde ahí.</p>
<p><b>Lo nuevo:</b></p>
<ul><li><b>Bloques</b> como en un control de verdad: cruceta con OK, teclado numérico, reproducción y botones de colores.</li>
<li><b>Temas del control</b>: Grafito, Claro, Arena y Vidrio, con color del cuerpo, esquinas y separación.</li>
<li><b>Estilo de cada elemento</b>: tamaño y grosor de letra, tamaño del ícono, fondo, letra, borde, color al estar activo, esquinas o píldora, y relieve (con relieve, plano o contorno).</li>
<li><b>Texto e ícono propios</b>, aparte del nombre del botón aprendido. El ícono se busca por nombre.</li>
<li><b>Mantener apretado</b> repite (para volumen) u otro botón.</li>
<li>Duplicar un control para otro aparato, o elementos sueltos.</li></ul>
<table><tr><th>Categoría</th><th>Formas</th></tr>
<tr><td>Botón: una acción</td><td>Pulsador · Encender/apagar · Marca o app · Secuencia</td></tr>
<tr><td>Niveles: un valor que sube y baja</td><td>Subir/bajar con el valor en el medio · Barra · Escalones · Perilla. Números o nombres, frena o vuelve al inicio, envía subir/bajar, uno que avanza o uno por nivel</td></tr>
<tr><td>Modos: estados con nombre</td><td>Botones · Lista · Un botón que rota</td></tr>
<tr><td>Información: solo muestra</td><td>Valor · Gráfico · Título · Separador</td></tr>
<tr><td>Bloques</td><td>Cruceta · Teclado numérico · Reproducción · Colores</td></tr></table>
<p>Marcas: unas 80 entre marcas y teclas, con buscador. Donde hay ícono libre se usa; si no, la inicial con el color de la marca, porque los logos oficiales no se pueden incluir libremente.</p>
<h3>4 · Controles en el plano</h3>
<ul><li>Se pega cualquier elemento del control a un símbolo, y es el mismo del diseñador.</li>
<li>Se arrastra a donde uno quiera y se puede fijar con el candado. Al mover el símbolo, lo pegado lo acompaña. Un imán suave lo alinea con el centro del símbolo.</li>
<li>El tamaño se cambia arrastrando la esquina o con los controles del panel, y los dos siempre muestran lo mismo. Lo mismo pasa con el tamaño del símbolo.</li>
<li>Estilo propio: letra, tamaño del valor, fondo, letra, esquinas, opacidad y relieve. «Crece con el símbolo» decide si acompaña su tamaño.</li>
<li>Fuera de la edición, el control funciona. El anillo del símbolo muestra la velocidad, sin animaciones de giro.</li></ul>
<h3>Para decidir al aprobar</h3>
<ul><li>¿Los nombres de las categorías te sirven?</li>
<li>Al pasar el máximo en Niveles, ¿frena o vuelve al inicio?</li>
<li>¿Qué tema querés de base para los controles nuevos?</li></ul>`;

  $('#notes-btn').setAttribute('aria-pressed', String(!n.hidden));
